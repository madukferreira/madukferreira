<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="216" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2"/>

  <!-- Decorative Tech Background Elements -->
  <circle cx="700" cy="40" r="120" fill="#0284C7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="180" r="90" fill="#3B82F6" opacity="0.06" filter="url(#glow)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150" stroke="#1E293B" stroke-width="1" opacity="0.4"/>
  <path d="M 200,0 L 200,220 M 400,0 L 400,220 M 600,0 L 600,220" stroke="#1E293B" stroke-width="1" opacity="0.4"/>

  <!-- Tech Symbol Art on Right -->
  <g transform="translate(620, 50)" opacity="0.85">
    <!-- Code Bracket Visual -->
    <rect x="0" y="0" width="120" height="120" rx="12" fill="#1E293B" opacity="0.5" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt; / &gt;</text>
  </g>

  <!-- Badge Header -->
  <rect x="50" y="38" width="220" height="26" rx="13" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="160" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1">CIÊNCIA DA COMPUTAÇÃO</text>

  <!-- Main Name -->
  <text x="50" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">Maria Ferreira</text>

  <!-- Tagline -->
  <text x="50" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">Desenvolvendo lógica, construindo o futuro &amp; explorando tecnologia.</text>
  <text x="50" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#0284C7">🎓 UNICID • 2º Semestre</text>
</svg>