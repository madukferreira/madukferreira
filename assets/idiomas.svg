<svg xmlns="http://www.w3.org/2000/svg" width="800" height="135" viewBox="0 0 800 135" fill="none">
  <defs>
    <linearGradient id="card-bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="796" height="131" rx="12" fill="url(#card-bg-4)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="2" y="2" width="6" height="131" rx="3" fill="#818CF8"/>

  <!-- Title -->
  <g transform="translate(25, 22)">
    <circle cx="14" cy="14" r="14" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
    <text x="14" y="19" font-family="sans-serif" font-size="12" fill="#818CF8" text-anchor="middle">🌐</text>
    <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Idiomas</text>
  </g>

  <!-- Português -->
  <g transform="translate(25, 62)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Português</text>
    <text x="100" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#38BDF8">• Nativo</text>
    <rect x="200" y="5" width="550" height="12" rx="6" fill="#1E293B"/>
    <rect x="200" y="5" width="550" height="12" rx="6" fill="url(#bar-grad)"/>
  </g>

  <!-- Inglês -->
  <g transform="translate(25, 96)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">Inglês</text>
    <text x="100" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#38BDF8">• Fluente</text>
    <rect x="200" y="5" width="550" height="12" rx="6" fill="#1E293B"/>
    <rect x="200" y="5" width="500" height="12" rx="6" fill="url(#bar-grad)"/>
  </g>
</svg>