<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
  </defs>
  
  <rect x="2" y="2" width="796" height="146" rx="12" fill="url(#card-bg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="2" y="2" width="6" height="146" rx="3" fill="#38BDF8"/>

  <!-- Icon + Title -->
  <g transform="translate(25, 22)">
    <circle cx="14" cy="14" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <!-- User Icon -->
    <path d="M14 8 C11.8 8 10 9.8 10 12 C10 14.2 11.8 16 14 16 C16.2 16 18 14.2 18 12 C18 9.8 16.2 8 14 8 Z M8 20 C8 17.3 12 16.9 14 16.9 C16 16.9 20 17.3 20 20 V21 H8 V20 Z" fill="#38BDF8"/>
    <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">Sobre Mim</text>
  </g>

  <!-- Content Paragraph -->
  <text x="25" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0" width="750">
    <tspan x="25" dy="0">Olá! Meu nome é <tspan font-weight="700" fill="#38BDF8">Maria Ferreira</tspan>.</tspan>
    <tspan x="25" dy="22">Sou estudante de Ciência da Computação na UNICID, atualmente no segundo semestre. Estou construindo meus</tspan>
    <tspan x="25" dy="22">conhecimentos em programação, algoritmos e fundamentos do desenvolvimento de software. Tenho interesse em</tspan>
    <tspan x="25" dy="22">aprender novas tecnologias, desenvolver minhas habilidades e aplicar meus conhecimentos em projetos práticos.</tspan>
  </text>
